name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    concurrency:
      group: diary-viewer-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
      cancel-in-progress: false
      queue: max
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Yarn
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Resolve fixed dependencies
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Check Calcit source
      run: |
        test ! -e compact.cirru
        test ! -e package.cirru
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-public --ns app.main --ns app.comp.container --ns app.comp.editor --ns app.comp.viewer --ns app.comp.food-analysis --ns app.comp.place-analysis --ns app.config --ns app.schema --ns app.util --ns app.util.string --ns app.updater --ns app.js-adapter --summary-only --format json

    - name: Select frontend CDN path
      id: assets
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        prefix="${GITHUB_REPOSITORY}/"
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        fi
        base="https://cos-sh.tiye.me/${prefix}"
        echo "VITE_BASE_URL=${base}" >> "$GITHUB_ENV"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "base=${base}" >> "$GITHUB_OUTPUT"

    - name: Build and test frontend
      run: |
        yarn build
        yarn test

    - name: Check production revision
      id: revision
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
        if [[ "$current" == "$GITHUB_SHA" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping superseded production deployment."
        fi

    - name: Check COS credentials
      id: credentials
      if: github.event_name == 'pull_request' || steps.revision.outputs.current == 'true'
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "::warning::COS upload skipped: configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY."
        else
          echo "::error::Production deployment requires COS credentials."
          exit 1
        fi

    - name: Upload and verify frontend assets
      if: steps.credentials.outputs.available == 'true'
      uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.assets.outputs.prefix }}
        public-base-url: ${{ steps.assets.outputs.base }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to original server path
      if: github.event_name == 'push' && steps.revision.outputs.current == 'true'
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
